name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt pytest

      # The suite never touches the network: every test parses a saved Scholar
      # page from tests/data/ or injects a fake fetcher.
      - name: Run tests
        run: python -m pytest tests -q
